<!DOCTYPE html>
<html>
  <head>
    <title>Login</title>
    <style>
      body {
        font-family: Arial;
        padding: 30px;
        max-width: 400px;
        margin: auto;
      }
      input {
        display: block;
        margin: 10px 0;
        padding: 10px;
        width: 100%;
      }
      button {
        padding: 10px;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <h2>Login</h2>
    <form action="/login" method="POST">
      <input type="text" name="username" placeholder="Username" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit">Log In</button>
    </form>
  </body>
</html>
