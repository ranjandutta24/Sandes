<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · Sandes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --aerogramme: #e3ebf2;
        --paper: #fbfcfd;
        --ink: #1b2a47;
        --postal-red: #b3303a;
        --slate: #66758c;
        --rule: #c9d5e1;
        --serif: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
        --sans: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      html, body { height: 100%; }

      body {
        margin: 0;
        font-family: var(--sans);
        color: var(--ink);
        background-color: var(--aerogramme);
        /* faint laid-paper texture */
        background-image:
          repeating-linear-gradient(0deg, rgba(27, 42, 71, 0.025) 0 1px, transparent 1px 6px),
          radial-gradient(ellipse at 20% 0%, #eef3f8 0%, transparent 60%);
        display: grid;
        place-items: center;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }

      /* ---------- The aerogramme ---------- */
      .letter {
        position: relative;
        width: min(460px, 100%);
        padding: 14px; /* airmail border thickness */
        background: repeating-linear-gradient(
          -45deg,
          var(--postal-red) 0 18px,
          var(--paper) 18px 27px,
          var(--ink) 27px 45px,
          var(--paper) 45px 54px
        );
        border-radius: 6px;
        box-shadow:
          0 1px 0 rgba(27, 42, 71, 0.08),
          0 30px 60px -30px rgba(27, 42, 71, 0.45);
      }

      .sheet {
        position: relative;
        background: var(--paper);
        border-radius: 2px;
        padding: 56px 44px 40px;
      }

      /* ---------- Postmark ---------- */
      .postmark {
        position: absolute;
        top: -6px;
        right: 18px;
        width: 112px;
        height: 112px;
        color: var(--postal-red);
        transform: rotate(-12deg);
        animation: stamp 700ms cubic-bezier(0.2, 0.9, 0.3, 1.2) 250ms both;
      }

      @keyframes stamp {
        0% { opacity: 0; transform: rotate(-30deg) scale(1.6); }
        60% { opacity: 1; }
        100% { opacity: 1; transform: rotate(-12deg) scale(1); }
      }

      /* ---------- Wordmark ---------- */
      .wordmark {
        margin: 0;
        font-family: var(--serif);
        font-weight: 500;
        font-optical-sizing: auto;
        font-size: clamp(3.4rem, 12vw, 4.6rem);
        line-height: 0.95;
        letter-spacing: -0.02em;
      }

      .wordmark .initial {
        font-style: italic;
        font-weight: 400;
      }

      .lede {
        margin: 14px 0 36px;
        max-width: 26ch;
        font-family: var(--serif);
        font-style: italic;
        font-size: 1.125rem;
        line-height: 1.5;
        color: var(--slate);
      }

      /* ---------- Form as writing lines ---------- */
      .field { margin-bottom: 26px; }

      .field label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--slate);
        margin-bottom: 6px;
      }

      .field input {
        width: 100%;
        border: 0;
        border-bottom: 1.5px solid var(--rule);
        background: transparent;
        padding: 8px 0 10px;
        font-family: var(--sans);
        font-size: 1.0625rem;
        color: var(--ink);
        border-radius: 0;
        transition: border-color 160ms ease;
      }

      .field input:focus {
        outline: none;
        border-bottom-color: var(--ink);
      }

      .field input:focus-visible {
        box-shadow: 0 2px 0 0 var(--ink);
      }

      .error {
        display: none;
        margin: -6px 0 22px;
        padding: 10px 12px;
        border-left: 3px solid var(--postal-red);
        background: #f8ecec;
        color: #8a2129;
        font-size: 0.9375rem;
        line-height: 1.4;
      }

      .error.show { display: block; }

      .submit {
        width: 100%;
        margin-top: 8px;
        padding: 15px 20px;
        border: 0;
        border-radius: 999px;
        background: var(--ink);
        color: var(--paper);
        font-family: var(--sans);
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.01em;
        cursor: pointer;
        transition: background-color 160ms ease, transform 120ms ease;
      }

      .submit:hover { background: #24375c; }
      .submit:active { transform: translateY(1px); }

      .submit:focus-visible {
        outline: 2px solid var(--postal-red);
        outline-offset: 3px;
      }

      .footnote {
        margin: 28px 0 0;
        text-align: center;
        font-size: 0.8125rem;
        color: var(--slate);
      }

      @media (max-width: 480px) {
        .sheet { padding: 64px 26px 32px; }
        .postmark { width: 92px; height: 92px; right: 10px; }
        .letter { padding: 10px; }
      }

      @media (prefers-reduced-motion: reduce) {
        .postmark { animation: none; }
        * { transition: none !important; }
      }
    </style>
  </head>
  <body>
    <main class="letter">
      <div class="sheet">
        <!-- Postmark with dove -->
        <svg class="postmark" viewBox="0 0 120 120" aria-hidden="true">
          <defs>
            <path id="ring" d="M60,60 m-44,0 a44,44 0 1,1 88,0 a44,44 0 1,1 -88,0" />
          </defs>
          <circle cx="60" cy="60" r="56" fill="none" stroke="currentColor" stroke-width="2" />
          <circle cx="60" cy="60" r="34" fill="none" stroke="currentColor" stroke-width="1.2" />
          <text font-family="Figtree, sans-serif" font-size="10.5" font-weight="600" letter-spacing="3" fill="currentColor">
            <textPath href="#ring" startOffset="0">SANDES · BY AIR · SANDES · BY AIR ·</textPath>
          </text>
          <!-- dove -->
          <g transform="translate(60 64) scale(0.92)" fill="currentColor">
            <path opacity=".55" d="M2 3 C6 -7 14 -14 27 -17 C21 -8 15 -1 10 5 Z" />
            <path d="M-23 5 C-20 1 -15 0 -11 2 C-5 5 3 6 10 3 L25 -3 L21 6 C14 11 2 14 -8 12 C-14 11 -19 9 -23 5 Z" />
            <path d="M-6 4 C-5 -8 2 -18 15 -23 C11 -13 9 -5 6 5 Z" />
            <path d="M-23 5 L-27 6.5 L-22.5 7 Z" />
            <circle cx="-16" cy="4" r="1.1" fill="#fbfcfd" />
          </g>
        </svg>

        <h1 class="wordmark"><span class="initial">S</span>andes</h1>
        <p class="lede">Sign in to read your messages.</p>

        <div class="error" id="error" role="alert">
          That username and password don't match. Check them and try again.
        </div>

        <form action="/login" method="POST">
          <div class="field">
            <label for="username">Username</label>
            <input id="username" type="text" name="username" autocomplete="username" required autofocus />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" type="password" name="password" autocomplete="current-password" required />
          </div>
          <button class="submit" type="submit">Sign in</button>
        </form>

        <p class="footnote">Messages arrive for everyone in the room.</p>
      </div>
    </main>

    <script>
      if (new URLSearchParams(location.search).has("error")) {
        document.getElementById("error").classList.add("show");
      }
    </script>
  </body>
</html>
