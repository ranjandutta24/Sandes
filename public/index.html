<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sandes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/crackers.css" />
    <link rel="stylesheet" href="/board.css" />
    <style>
      :root {
        --aerogramme: #e3ebf2;
        --paper: #fbfcfd;
        --ink: #1b2a47;
        --postal-red: #b3303a;
        --slate: #66758c;
        --rule: #c9d5e1;
        --serif: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
        --sans: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
        --airmail: repeating-linear-gradient(
          -45deg,
          var(--postal-red) 0 14px,
          var(--paper) 14px 20px,
          var(--ink) 20px 34px,
          var(--paper) 34px 40px
        );
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }

      body {
        margin: 0;
        font-family: var(--sans);
        color: var(--ink);
        background-color: var(--aerogramme);
        background-image: repeating-linear-gradient(0deg, rgba(27, 42, 71, 0.025) 0 1px, transparent 1px 6px);
        -webkit-font-smoothing: antialiased;
      }

      button { font: inherit; color: inherit; }

      .sr-only {
        position: absolute; width: 1px; height: 1px; overflow: hidden;
        clip: rect(0 0 0 0); white-space: nowrap;
      }

      :focus-visible { outline: 2px solid var(--postal-red); outline-offset: 2px; }

      .app {
        height: 100dvh;
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
      }

      /* ================= Sidebar ================= */
      .sidebar {
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--paper);
        border-right: 1px solid #d6e0ea;
      }

      .brand {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 20px 22px 24px;
      }

      .brand::after {
        content: "";
        position: absolute; left: 0; right: 0; bottom: 0;
        height: 6px;
        background: var(--airmail);
      }

      .mark { width: 38px; height: 38px; color: var(--postal-red); flex: none; }

      .wordmark {
        margin: 0;
        font-family: var(--serif);
        font-weight: 500;
        font-size: 2rem;
        line-height: 1;
        letter-spacing: -0.02em;
      }

      .wordmark .initial { font-style: italic; font-weight: 400; }

      .lists { flex: 1; overflow-y: auto; padding: 14px 10px; }

      .list-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 18px 12px 8px;
        font-family: var(--serif);
        font-style: italic;
        font-size: 1rem;
        color: var(--slate);
      }

      .new-chat {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1.5px solid var(--rule);
        background: transparent;
        border-radius: 999px;
        padding: 5px 12px;
        font-family: var(--sans);
        font-style: normal;
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--ink);
        cursor: pointer;
      }

      .new-chat:hover { border-color: var(--ink); }

      .convo {
        width: 100%;
        display: grid;
        grid-template-columns: 40px 1fr auto;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }

      .convo:hover { background: #eef3f8; }
      .convo[aria-current="true"] { background: var(--aerogramme); }

      .avatar {
        width: 40px; height: 40px;
        border-radius: 50%;
        display: grid; place-items: center;
        font-family: var(--serif);
        font-size: 1.125rem;
        font-weight: 600;
        color: #fff;
        flex: none;
      }

      .avatar { position: relative; overflow: hidden; }
      .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .avatar.sm { width: 28px; height: 28px; font-size: 0.8125rem; }
      .avatar.lg { width: 84px; height: 84px; font-size: 2rem; }
      .avatar.room { background: transparent; border: 1.5px solid var(--postal-red); color: var(--postal-red); }
      .avatar.room svg { width: 24px; height: 24px; }

      .convo .meta { min-width: 0; }
      .convo .name { font-weight: 600; font-size: 0.9375rem; }

      .convo .preview {
        display: block;
        margin-top: 2px;
        font-size: 0.8125rem;
        color: var(--slate);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }

      .convo .side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
      .convo .when { font-size: 0.75rem; color: var(--slate); }

      .badge {
        min-width: 20px; height: 20px; padding: 0 6px;
        border-radius: 999px;
        background: var(--postal-red);
        color: #fff;
        font-size: 0.75rem; font-weight: 600;
        display: grid; place-items: center;
      }

      .hint { margin: 6px 12px; font-size: 0.875rem; color: var(--slate); line-height: 1.45; }

      .account {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 18px;
        border-top: 1px solid #d6e0ea;
        font-size: 0.875rem;
        color: var(--slate);
      }

      .account strong { color: var(--ink); }

      .logout {
        margin-left: auto;
        color: var(--ink);
        text-decoration: none;
        font-weight: 500;
        padding: 6px 12px;
        border: 1.5px solid var(--rule);
        border-radius: 999px;
      }

      .logout:hover { border-color: var(--ink); }

      .me-btn {
        flex: 1; min-width: 0;
        display: flex; align-items: center; gap: 10px;
        margin: -6px 0 -6px -8px; padding: 6px 8px;
        border: 0; border-radius: 12px;
        background: transparent; text-align: left; cursor: pointer;
      }

      .me-btn:hover { background: #eef3f8; }
      .me-text { min-width: 0; display: flex; flex-direction: column; }
      .me-text strong { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .me-text small { font-size: 0.75rem; color: var(--slate); }

      .icon-link {
        flex: none; width: 34px; height: 34px;
        display: grid; place-items: center;
        border: 1.5px solid var(--rule); border-radius: 50%;
        color: var(--ink);
      }

      .icon-link:hover { border-color: var(--ink); }
      .icon-link svg { width: 18px; height: 18px; }
      .icon-link[hidden], .attach[hidden], .new-chat[hidden], .cracker-btn[hidden], .pill-btn[hidden] { display: none; }

      /* ================= Chat pane ================= */
      .chat {
        position: relative;
        display: grid;
        grid-template-rows: auto 1fr auto;
        grid-template-columns: minmax(0, 1fr);
        min-height: 0;
        min-width: 0;
      }

      .chat-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 28px;
        border-bottom: 1px solid #d6e0ea;
        background: rgba(251, 252, 253, 0.7);
        backdrop-filter: blur(6px);
      }

      .back {
        display: none;
        border: 0; background: transparent; padding: 6px; margin-left: -6px; cursor: pointer;
      }

      .back svg { width: 22px; height: 22px; }

      .chat-title { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 1.5rem; line-height: 1.1; }
      .chat-sub { margin: 2px 0 0; font-size: 0.8125rem; color: var(--slate); }

      .feed { overflow-y: auto; padding: 24px 28px 12px; }

      .feed-inner { max-width: 820px; margin: 0 auto; }

      .day {
        display: flex; align-items: center; gap: 14px;
        margin: 22px 0 18px;
        font-family: var(--serif); font-style: italic; font-size: 0.9375rem;
        color: var(--slate);
      }

      .day::before, .day::after { content: ""; flex: 1; height: 1px; background: var(--rule); }

      .msg { display: flex; flex-direction: column; align-items: flex-start; margin-top: 10px; }
      .msg.cont { margin-top: 2px; }
      .msg { position: relative; }
      .msg.has-av { padding-left: 36px; }
      .msg .mav { position: absolute; left: 0; top: 0; }
      .msg .from { font-size: 0.75rem; font-weight: 600; margin: 0 0 3px 4px; }
      .msg.cont .from, .msg.mine .from, .chat.direct .msg .from { display: none; }

      .bubble {
        position: relative;
        max-width: min(62ch, 78%);
        padding: 6px 12px 6px;
        background: var(--paper);
        border: 1px solid #d6e0ea;
        border-radius: 4px 14px 14px 14px;
        box-shadow: 0 1px 0 rgba(27, 42, 71, 0.06);
        font-size: 0.9375rem;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }

      .bubble .text { white-space: pre-wrap; }
      .msg.cont .bubble { border-top-left-radius: 14px; }

      /* time sits at the end of the last text line; an invisible copy reserves its space */
      .bubble time { font-size: 0.6875rem; line-height: 1; color: var(--slate); white-space: nowrap; }
      .bubble .text time { position: absolute; right: 12px; bottom: 7px; }
      .bubble .stamp-space { display: inline-block; visibility: hidden; margin-left: 10px; font-size: 0.6875rem; line-height: 1; }
      .bubble > time { display: block; text-align: right; margin-top: 2px; }

      .msg.mine { align-items: flex-end; }

      .msg.mine .bubble {
        background: var(--ink); border-color: var(--ink); color: var(--paper);
        border-radius: 14px 4px 14px 14px;
      }

      .msg.mine.cont .bubble { border-top-right-radius: 14px; }
      .msg.mine .bubble time { color: #a9b6cb; }

      /* attachments inside bubbles */
      .files { display: flex; flex-direction: column; gap: 6px; margin: 0 -6px 4px; padding-top: 0; }
      .files + .text { margin-top: 2px; }

      .shot { display: block; border-radius: 9px; overflow: hidden; line-height: 0; }

      .shot img {
        max-width: min(320px, 100%);
        max-height: 320px;
        object-fit: cover;
        background: #e9eff5;
      }

      .file {
        display: flex; align-items: center; gap: 12px;
        min-width: 200px;
        padding: 8px 10px;
        border-radius: 10px;
        background: #eef3f8;
        color: var(--ink);
        text-decoration: none;
      }

      .msg.mine .file { background: rgba(255, 255, 255, 0.1); color: var(--paper); }
      .file:hover { text-decoration: underline; }
      .file svg { width: 26px; height: 26px; flex: none; color: var(--postal-red); }
      .msg.mine .file svg { color: #f1b9be; }
      .file .fname { font-weight: 600; font-size: 0.9375rem; overflow-wrap: anywhere; }
      .file .fsize { display: block; font-size: 0.75rem; opacity: 0.75; }

      .msg.fresh .bubble { animation: arrive 260ms ease-out both; }

      @keyframes arrive {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: none; }
      }

      .empty {
        margin: 16vh auto 0;
        max-width: 32ch;
        text-align: center;
        font-family: var(--serif); font-style: italic; font-size: 1.25rem; line-height: 1.5;
        color: var(--slate);
      }

      /* ================= Composer ================= */
      .composer-wrap { padding: 8px 28px 22px; }
      .composer-inner { max-width: 820px; margin: 0 auto; }

      .status { min-height: 0; margin-bottom: 6px; font-size: 0.875rem; color: #8a2129; }
      .status:empty { display: none; }

      .pending { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
      .pending:empty { display: none; }

      .chip {
        display: inline-flex; align-items: center; gap: 8px;
        max-width: 260px;
        padding: 6px 6px 6px 12px;
        background: var(--paper);
        border: 1.5px solid var(--rule);
        border-radius: 999px;
        font-size: 0.8125rem;
      }

      .chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .chip small { color: var(--slate); flex: none; }

      .chip button {
        flex: none;
        width: 22px; height: 22px;
        display: grid; place-items: center;
        border: 0; border-radius: 50%;
        background: #e3ebf2;
        cursor: pointer;
        font-size: 14px; line-height: 1;
      }

      .chip button:hover { background: var(--rule); }

      .composer { display: flex; gap: 10px; align-items: stretch; }

      .attach {
        flex: none;
        width: 52px;
        display: grid; place-items: center;
        border: 1.5px solid var(--rule);
        border-radius: 50%;
        background: var(--paper);
        cursor: pointer;
      }

      .attach:hover { border-color: var(--ink); }
      .attach svg { width: 22px; height: 22px; }

      .composer input[type="text"] {
        flex: 1; min-width: 0;
        padding: 15px 20px;
        border: 1.5px solid var(--rule);
        border-radius: 999px;
        background: var(--paper);
        font-family: var(--sans); font-size: 1rem; color: var(--ink);
      }

      .composer input[type="text"]::placeholder { color: #8f9bb0; }
      .composer input[type="text"]:focus { outline: none; border-color: var(--ink); }
      .composer input[type="text"]:disabled { background: #eef3f8; }

      .send {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 0 24px;
        border: 0; border-radius: 999px;
        background: var(--postal-red);
        color: #fff;
        font-weight: 600; font-size: 1rem;
        cursor: pointer;
      }

      .send:hover { background: #9c2730; }
      .send:disabled { opacity: 0.55; cursor: default; }
      .send svg { width: 18px; height: 18px; }

      /* drag & drop overlay */
      .drop {
        position: absolute; inset: 12px;
        display: none; place-items: center;
        border: 2.5px dashed var(--postal-red);
        border-radius: 18px;
        background: rgba(251, 252, 253, 0.92);
        font-family: var(--serif); font-style: italic; font-size: 1.5rem;
        color: var(--postal-red);
        pointer-events: none;
        z-index: 5;
      }

      .chat.dragging .drop { display: grid; }

      /* ================= New chat dialog ================= */
      dialog {
        width: min(420px, calc(100vw - 32px));
        padding: 0;
        border: 0;
        border-radius: 16px;
        background: var(--paper);
        color: var(--ink);
        box-shadow: 0 30px 80px -20px rgba(27, 42, 71, 0.5);
      }

      dialog::backdrop { background: rgba(27, 42, 71, 0.35); }

      .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 22px 8px; }
      .dlg-head h2 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 1.5rem; }

      .x {
        width: 34px; height: 34px;
        border: 0; border-radius: 50%;
        background: #eef3f8;
        cursor: pointer; font-size: 18px;
      }

      .dlg-search { padding: 8px 22px 12px; }

      .dlg-search input {
        width: 100%;
        padding: 12px 16px;
        border: 1.5px solid var(--rule);
        border-radius: 999px;
        font: inherit;
        background: #fff;
      }

      .dlg-search input:focus { outline: none; border-color: var(--ink); }

      .people { max-height: 50vh; overflow-y: auto; padding: 0 10px 14px; }

      .person {
        width: 100%;
        display: flex; align-items: center; gap: 12px;
        padding: 10px 12px;
        border: 0; border-radius: 12px;
        background: transparent;
        cursor: pointer; text-align: left;
        font-weight: 600;
      }

      .person:hover { background: #eef3f8; }

      /* ================= Profile ================= */
      .pf { padding: 6px 22px 22px; }
      .pf-top { display: flex; gap: 18px; align-items: center; padding-bottom: 18px; border-bottom: 1px solid #e1e8ef; }
      .pf-name { font-size: 1.25rem; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
      .pf-meta { margin-top: 2px; font-size: 0.8125rem; color: var(--slate); }
      .pf-meta b { color: var(--ink); font-weight: 600; letter-spacing: 0.02em; }
      .pf-pic { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
      .pf-sec { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
      .pf-sec h3 { margin: 0; font-size: 0.8125rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--slate); }
      .pf-row { display: flex; gap: 8px; }
      .pf input[type="text"], .pf input[type="password"] {
        flex: 1; min-width: 0; width: 100%;
        padding: 11px 16px;
        border: 1.5px solid var(--rule); border-radius: 999px;
        background: #fff; font: inherit; color: var(--ink);
      }
      .pf input:focus { outline: none; border-color: var(--ink); }
      .pf input:disabled { background: #eef3f8; color: var(--slate); }
      .pf-note, .pf-msg { margin: 0; font-size: 0.8125rem; color: var(--slate); line-height: 1.4; }
      .pf-msg:empty, .pf-note:empty { display: none; }
      .pf-msg.err { color: #8a2129; }
      .pf-msg.ok { color: #2e6b5a; }

      .pill-btn {
        flex: none;
        display: inline-flex; align-items: center; justify-content: center;
        padding: 8px 16px;
        border: 1.5px solid var(--rule); border-radius: 999px;
        background: var(--paper);
        font-size: 0.875rem; font-weight: 600; color: var(--ink);
        cursor: pointer;
      }
      .pill-btn:hover { border-color: var(--ink); }
      .pill-btn.solid { background: var(--ink); border-color: var(--ink); color: var(--paper); }
      .pill-btn.solid:hover { background: #24375c; }
      .pill-btn:disabled { opacity: 0.5; cursor: default; }
      .pf-sec > .pill-btn { align-self: flex-start; }

      /* ================= Mobile ================= */
      @media (max-width: 760px) {
        .app { grid-template-columns: minmax(0, 1fr); }
        .app .chat { display: none; }
        .app.in-chat .sidebar { display: none; }
        .app.in-chat .chat { display: grid; }
        .back { display: inline-grid; }
        .chat-head { padding: 12px 14px; }
        .feed { padding: 16px 14px 10px; }
        .bubble { max-width: 86%; }
        .composer-wrap { padding: 8px 12px 14px; }
        .attach { width: 48px; }
        .send { padding: 0 16px; }
        .send span { display: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        .msg.fresh .bubble { animation: none; }
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="dove" viewBox="-28 -26 56 42">
        <path opacity=".55" d="M2 3 C6 -7 14 -14 27 -17 C21 -8 15 -1 10 5 Z" />
        <path d="M-23 5 C-20 1 -15 0 -11 2 C-5 5 3 6 10 3 L25 -3 L21 6 C14 11 2 14 -8 12 C-14 11 -19 9 -23 5 Z" />
        <path d="M-6 4 C-5 -8 2 -18 15 -23 C11 -13 9 -5 6 5 Z" />
        <path d="M-23 5 L-27 6.5 L-22.5 7 Z" />
      </symbol>
      <symbol id="doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><path d="M14 2v6h6" />
      </symbol>
    </svg>

    <div class="app" id="app">
      <!-- ============ Sidebar ============ -->
      <aside class="sidebar" aria-label="Conversations">
        <div class="brand">
          <svg class="mark" fill="currentColor" aria-hidden="true"><use href="#dove" /></svg>
          <h1 class="wordmark"><span class="initial">S</span>andes</h1>
        </div>

        <nav class="lists">
          <div id="rooms"></div>

          <div class="list-head">
            <span>Direct messages</span>
            <button class="new-chat" id="newChat" type="button">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
              New
            </button>
          </div>
          <div id="directs"></div>
        </nav>

        <div class="account">
          <button class="me-btn" id="meBtn" type="button" title="Your profile: picture, username, password">
            <span id="meAvatar"></span>
            <span class="me-text"><strong id="me">…</strong><small id="meSub">Your profile</small></span>
          </button>
          <a class="icon-link" id="adminLink" href="/admin" title="Admin: users and settings" aria-label="Admin: users and settings" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5 4 5.5v6c0 4.6 3.3 8.6 8 10 4.7-1.4 8-5.4 8-10v-6z" /><path d="m9 12 2 2 4-4" /></svg>
          </a>
          <a class="logout" href="/logout">Log out</a>
        </div>
      </aside>

      <!-- ============ Chat ============ -->
      <section class="chat" id="chat" aria-labelledby="chatTitle">
        <header class="chat-head">
          <button class="back" id="back" type="button" aria-label="Back to conversations">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6" /></svg>
          </button>
          <div id="chatAvatar"></div>
          <div>
            <h2 class="chat-title" id="chatTitle">Main room</h2>
            <p class="chat-sub" id="chatSub">Everyone can read messages here</p>
          </div>
        </header>

        <main class="feed" id="feed" aria-live="polite">
          <div class="feed-inner" id="messages"></div>
        </main>

        <div class="composer-wrap">
          <div class="composer-inner">
            <div class="status" id="status" role="status"></div>
            <div class="pending" id="pending" aria-label="Files to send"></div>
            <form class="composer" id="composer" autocomplete="off">
              <label class="attach" id="attachBtn" title="Attach files">
                <span class="sr-only">Attach files</span>
                <input type="file" id="fileInput" multiple hidden />
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48" /></svg>
              </label>
              <button class="cracker-btn" id="crackerBtn" type="button" title="Diwali crackers" aria-label="Diwali crackers" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="15" r="6.5" /><path d="M14.6 10.4c1-1.6 2-2.9 3.9-3.4" /><path d="M20.6 1.8v1.8M23 4.6h-1.8M22.4 2.4l-1.2 1.2" /></svg>
              </button>
              <label for="msg" class="sr-only">Message</label>
              <input type="text" id="msg" placeholder="Write a message" maxlength="4000" />
              <button class="send" id="send" type="submit">
                <span>Send</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13" /><path d="M22 2 15 22l-4-9-9-4 20-7z" /></svg>
              </button>
            </form>
          </div>
        </div>

        <div class="drop" aria-hidden="true">Drop files to attach</div>
      </section>
    </div>

    <!-- ============ New direct chat ============ -->
    <dialog id="peopleDlg" aria-labelledby="peopleTitle">
      <div class="dlg-head">
        <h2 id="peopleTitle">New message</h2>
        <button class="x" type="button" id="closeDlg" aria-label="Close">×</button>
      </div>
      <div class="dlg-search">
        <label for="peopleSearch" class="sr-only">Search people</label>
        <input id="peopleSearch" type="search" placeholder="Search people" />
      </div>
      <div class="people" id="people"></div>
    </dialog>

    <!-- ============ Profile ============ -->
    <dialog id="profileDlg" aria-labelledby="profileTitle">
      <div class="dlg-head">
        <h2 id="profileTitle">Your profile</h2>
        <button class="x" type="button" id="closeProfile" aria-label="Close">×</button>
      </div>
      <div class="pf">
        <div class="pf-top">
          <div id="pfAvatar"></div>
          <div>
            <div class="pf-name" id="pfName"></div>
            <div class="pf-meta">User ID <b id="pfUid"></b> · <span id="pfRole"></span></div>
            <div class="pf-pic">
              <label class="pill-btn" id="pfPick">
                Change picture
                <input type="file" id="pfFile" accept="image/png,image/jpeg,image/gif,image/webp" hidden />
              </label>
              <button class="pill-btn" id="pfRemove" type="button">Remove</button>
            </div>
            <p class="pf-msg" id="pfPicMsg" role="status"></p>
          </div>
        </div>

        <form class="pf-sec" id="pfNameForm" autocomplete="off">
          <h3><label for="pfUsername">Username</label></h3>
          <div class="pf-row">
            <input type="text" id="pfUsername" maxlength="40" />
            <button class="pill-btn solid" id="pfNameSave" type="submit">Save</button>
          </div>
          <p class="pf-note" id="pfNameNote"></p>
          <p class="pf-msg" id="pfNameMsg" role="status"></p>
        </form>

        <form class="pf-sec" id="pfPassForm">
          <h3>Password</h3>
          <input type="text" name="username" autocomplete="username" hidden id="pfPassUser" />
          <input type="password" id="pfCur" placeholder="Current password" autocomplete="current-password" aria-label="Current password" required />
          <input type="password" id="pfNew" placeholder="New password (at least 6 characters)" autocomplete="new-password" aria-label="New password" required minlength="6" />
          <input type="password" id="pfNew2" placeholder="New password again" autocomplete="new-password" aria-label="New password again" required />
          <button class="pill-btn solid" type="submit">Change password</button>
          <p class="pf-msg" id="pfPassMsg" role="status"></p>
        </form>
      </div>
    </dialog>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const MAX_FILES = 20; // no size limit (LAN)

      const $ = (id) => document.getElementById(id);
      const appEl = $("app"), chatEl = $("chat"), feed = $("feed"), list = $("messages");
      const input = $("msg"), sendBtn = $("send"), statusEl = $("status");
      const fileInput = $("fileInput"), pendingEl = $("pending");

      const inks = ["#2f5d8a", "#7a3e6c", "#2e6b5a", "#8a5a1f", "#4b4f9c", "#9a3b3b", "#3d6e7e", "#6b5b2e"];
      const inkFor = (name = "") => {
        let h = 0;
        for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
        return inks[h % inks.length];
      };

      const fmtSize = (b) =>
        b < 1024 ? `${b} B` : b < 1048576 ? `${(b / 1024).toFixed(0)} KB` : `${(b / 1048576).toFixed(1)} MB`;

      const el = (tag, props = {}, ...kids) => {
        const n = Object.assign(document.createElement(tag), props);
        kids.flat().forEach((k) => k != null && n.append(k));
        return n;
      };

      const svgUse = (id, cls) => {
        const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        if (cls) s.setAttribute("class", cls);
        s.setAttribute("aria-hidden", "true");
        s.setAttribute("fill", "currentColor");
        const u = document.createElementNS("http://www.w3.org/2000/svg", "use");
        u.setAttribute("href", "#" + id);
        s.append(u);
        return s;
      };

      // Initials on the person's colour, with their picture on top if they have one
      const userAvatar = (name, image, cls = "") => {
        const a = el("div", { className: ("avatar " + cls).trim() }, (name || "?")[0].toUpperCase());
        a.style.background = inkFor(name);
        if (image) {
          const img = el("img", { src: image, alt: "" });
          img.onerror = () => img.remove();
          a.append(img);
        }
        return a;
      };

      const avatarFor = (c) => {
        if (c.type === "room") return el("div", { className: "avatar room" }, svgUse("dove"));
        return userAvatar(c.name, c.image);
      };

      const shortTime = (iso) => {
        if (!iso) return "";
        const d = new Date(iso);
        return d.toDateString() === new Date().toDateString()
          ? d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })
          : d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
      };

      const dayLabel = (d) => {
        const y = new Date();
        y.setDate(y.getDate() - 1);
        if (d.toDateString() === new Date().toDateString()) return "Today";
        if (d.toDateString() === y.toDateString()) return "Yesterday";
        return d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
      };

      // ---------------- state ----------------
      let me = null;
      let settings = {};
      let conversations = [];
      let activeId = null;
      const unread = {};
      let pendingFiles = [];
      let lastSender = null, lastDay = null;

      // ---------------- sidebar ----------------
      function renderSidebar() {
        const rooms = $("rooms"), directs = $("directs");
        rooms.replaceChildren();
        directs.replaceChildren();

        for (const c of conversations) {
          const preview =
            c.last_message ||
            (c.last_has_attachments ? "Sent an attachment" : c.type === "direct" ? "Say hello" : "No messages yet");
          const who = c.type === "room" && c.last_sender && c.last_message ? `${c.last_sender}: ` : "";
          const btn = el(
            "button",
            { className: "convo", type: "button", onclick: () => openConversation(c.id) },
            avatarFor(c),
            el("span", { className: "meta" },
              el("span", { className: "name" }, c.name),
              el("span", { className: "preview" }, who + preview)),
            el("span", { className: "side" },
              el("span", { className: "when" }, shortTime(c.last_activity)),
              unread[c.id] ? el("span", { className: "badge", ariaLabel: `${unread[c.id]} unread` }, String(unread[c.id])) : null),
          );
          if (c.id === activeId) btn.setAttribute("aria-current", "true");
          (c.type === "room" ? rooms : directs).append(btn);
        }

        if (!directs.children.length) {
          directs.append(el("p", { className: "hint" }, "Private chats appear here. Use New to message someone."));
        }
      }

      async function loadConversations() {
        conversations = await (await fetch("/api/conversations")).json();
        renderSidebar();
      }

      // ---------------- messages ----------------
      function renderAttachment(a) {
        if (/^image\/(png|jpe?g|gif|webp|avif|bmp)$/.test(a.mime_type)) {
          const img = el("img", { src: a.url, alt: a.file_name });
          const link = el("a", { className: "shot", href: a.url, target: "_blank", rel: "noopener", title: a.file_name }, img);
          img.onerror = () => link.replaceWith(fileCard(a)); // unreadable image -> plain download
          return link;
        }
        return fileCard(a);
      }

      function fileCard(a) {
        return el("a", { className: "file", href: a.url + "?download=1", title: `Download ${a.file_name}` },
          svgUse("doc"),
          el("span", {}, el("span", { className: "fname" }, a.file_name), el("span", { className: "fsize" }, fmtSize(Number(a.size_bytes)))));
      }

      function appendMessage(m, fresh) {
        const empty = list.querySelector(".empty");
        if (empty) empty.remove();

        const sender = m.sender || "User";
        const when = new Date(m.timestamp);

        if (when.toDateString() !== lastDay) {
          list.append(el("div", { className: "day" }, dayLabel(when)));
          lastDay = when.toDateString();
          lastSender = null;
        }

        const row = el("div", { className: "msg" });
        const mine = me && (m.sender_id ? m.sender_id === me.id : sender === me.username);
        if (mine) row.classList.add("mine");
        if (sender === lastSender) row.classList.add("cont");
        if (fresh) row.classList.add("fresh");

        const from = el("div", { className: "from" }, sender);
        from.style.color = inkFor(sender);
        if (m.sender_id) from.dataset.uid = m.sender_id;
        // in rooms, other people's messages get their picture next to the first bubble
        const room = conversations.find((x) => x.id === m.conversation_id)?.type === "room";
        if (room && !mine) {
          row.classList.add("has-av");
          if (sender !== lastSender) {
            const av = userAvatar(sender, m.sender_image, "sm mav");
            if (m.sender_id) av.dataset.uid = m.sender_id;
            row.append(av);
          }
        }

        const bubble = el("div", { className: "bubble" });
        if (m.attachments && m.attachments.length) {
          bubble.append(el("div", { className: "files" }, m.attachments.map(renderAttachment)));
        }
        const time = el("time", { dateTime: when.toISOString() }, when.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }));
        if (m.message) {
          // text only, never HTML
          bubble.append(el("div", { className: "text" }, m.message, el("span", { className: "stamp-space", ariaHidden: "true" }, time.textContent), time));
        }
        else bubble.append(time);

        row.append(from, bubble);
        list.append(row);
        lastSender = sender;
      }

      // Keep the view pinned to the newest message unless the user scrolled up to read
      let stick = true;
      const scrollDown = () => { feed.scrollTop = feed.scrollHeight; stick = true; };
      feed.addEventListener("scroll", () => {
        stick = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;
      });
      // Images/fonts finishing loading grow the list after we scrolled; follow it down
      new ResizeObserver(() => stick && (feed.scrollTop = feed.scrollHeight)).observe(list);

      async function openConversation(id) {
        window.sandesCrackers?.reset();
        activeId = id;
        window.sandesBoard?.switchTo(id);
        unread[id] = 0;
        const c = conversations.find((x) => x.id === id);
        appEl.classList.add("in-chat");
        chatEl.classList.toggle("direct", c.type === "direct");
        $("chatTitle").textContent = c.name;
        $("chatSub").textContent = c.type === "room" ? "Everyone can read messages here" : "Private chat";
        $("chatAvatar").replaceChildren(avatarFor(c));
        renderSidebar();
        syncComposer();

        list.replaceChildren();
        lastSender = lastDay = null;
        const res = await fetch(`/api/conversations/${id}/messages`);
        if (activeId !== id) return; // user switched while loading
        const msgs = res.ok ? await res.json() : [];
        if (!msgs.length) {
          list.append(el("p", { className: "empty" },
            c.type === "room" ? "No messages yet. Write the first one below." : `This is the start of your private chat with ${c.name}.`));
        }
        msgs.forEach((m) => appendMessage(m, false));
        scrollDown();
        if (matchMedia("(min-width: 761px)").matches) input.focus();
      }

      $("back").onclick = () => {
        window.sandesCrackers?.reset();
        appEl.classList.remove("in-chat");
        activeId = null;
        window.sandesBoard?.switchTo(null);
        renderSidebar();
      };

      // ---------------- realtime ----------------
      const socket = io();

      socket.on("message", async (m) => {
        let c = conversations.find((x) => x.id === m.conversation_id);
        if (!c) {
          await loadConversations(); // someone started a new chat with you
          c = conversations.find((x) => x.id === m.conversation_id);
          if (!c) return;
        }
        c.last_message = m.message;
        c.last_has_attachments = (m.attachments || []).length > 0;
        c.last_sender = m.sender;
        c.last_activity = m.timestamp;
        conversations = [
          ...conversations.filter((x) => x.type === "room"),
          ...conversations.filter((x) => x.type !== "room").sort((a, b) => new Date(b.last_activity) - new Date(a.last_activity)),
        ];

        if (m.conversation_id === activeId) {
          appendMessage(m, true);
          if (stick || m.sender_id === me?.id) scrollDown();
        } else if (m.sender_id !== me?.id) {
          unread[m.conversation_id] = (unread[m.conversation_id] || 0) + 1;
        }
        renderSidebar();
      });

      socket.on("connect", () => { statusEl.textContent = ""; syncComposer(); });
      socket.on("disconnect", () => { statusEl.textContent = "Connection lost. Reconnecting…"; syncComposer(); });
      socket.on("connect_error", (err) => {
        if (err && err.message === "Account turned off") return (location.href = "/login?error=inactive");
        statusEl.textContent = "Can't reach the server. Retrying…";
      });

      // ---------------- account + settings ----------------
      socket.on("settings", applySettings);
      socket.on("account:disabled", () => (location.href = "/login?error=inactive"));
      socket.on("profile", (p) => { me = { ...me, ...p }; renderMe(); syncProfile(); });
      socket.on("user:updated", async (u) => {
        if (me && u.id === me.id) { me.username = u.username; me.image = u.image; renderMe(); }
        document.querySelectorAll(`.from[data-uid="${u.id}"]`).forEach((n) => (n.textContent = u.username));
        document.querySelectorAll(`.mav[data-uid="${u.id}"]`).forEach((n) => {
          const av = userAvatar(u.username, u.image, "sm mav");
          av.dataset.uid = u.id;
          n.replaceWith(av);
        });
        await loadConversations();
        const c = conversations.find((x) => x.id === activeId);
        if (c && c.type === "direct" && c.other_user_id === u.id) {
          $("chatTitle").textContent = c.name;
          $("chatAvatar").replaceChildren(avatarFor(c));
        }
      });

      function applySettings(s) {
        settings = window.sandesSettings = s;
        window.sandesCrackers?.setEnabled(s.crackers_enabled);
        window.sandesBoard?.setEnabled(s.board_enabled);
        $("attachBtn").hidden = !s.attachments_enabled;
        if (!s.attachments_enabled && pendingFiles.length) { pendingFiles = []; renderPending(); }
        $("newChat").hidden = !s.direct_messages_enabled;
        syncComposer();
        syncProfile();
      }

      // Direct chats are read-only while the admin has direct messages turned off
      function syncComposer() {
        const c = conversations.find((x) => x.id === activeId);
        const off = !!c && c.type === "direct" && settings.direct_messages_enabled === false;
        input.disabled = off;
        input.placeholder = off ? "Direct messages are turned off by the admin" : "Write a message";
        sendBtn.disabled = off || !socket.connected;
      }

      function renderMe() {
        if (!me) return;
        $("me").textContent = me.username;
        $("meAvatar").replaceChildren(userAvatar(me.username, me.image, "sm"));
        $("meSub").textContent = me.role === "admin" ? "Admin · your profile" : "Your profile";
        $("adminLink").hidden = me.role !== "admin";
      }

      async function api(method, url, body) {
        const opts = { method, headers: {} };
        if (body instanceof FormData) opts.body = body;
        else if (body) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
        const r = await fetch(url, opts);
        let data = {};
        try { data = await r.json(); } catch {}
        if (!r.ok) throw new Error(data.message || "Something went wrong. Try again.");
        return data;
      }

      // Crop to the middle square and shrink to 256px, so pictures are small and look the same everywhere
      async function squarePicture(file, size = 256) {
        const url = URL.createObjectURL(file);
        try {
          const img = await new Promise((resolve, reject) => {
            const i = new Image();
            i.onload = () => resolve(i);
            i.onerror = () => reject(new Error("That file isn't a picture this browser can read"));
            i.src = url;
          });
          const s = Math.min(img.naturalWidth, img.naturalHeight);
          const c = document.createElement("canvas");
          c.width = c.height = size;
          c.getContext("2d").drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, size, size);
          return await new Promise((resolve) => c.toBlob(resolve, "image/webp", 0.9));
        } finally {
          URL.revokeObjectURL(url);
        }
      }

      // ---------------- profile dialog ----------------
      const pdlg = $("profileDlg");
      const say = (id, text, kind = "") => { const n = $(id); n.textContent = text; n.className = "pf-msg " + kind; };

      function syncProfile() {
        if (!me) return;
        const admin = me.role === "admin";
        const canName = admin || settings.users_can_change_username !== false;
        const canPic = admin || settings.users_can_change_picture !== false;
        $("pfAvatar").replaceChildren(userAvatar(me.username, me.image, "lg"));
        $("pfName").textContent = me.username;
        $("pfUid").textContent = me.user_id || "";
        $("pfRole").textContent = admin ? "Admin" : "Member";
        $("pfPassUser").value = me.username;
        $("pfUsername").disabled = $("pfNameSave").disabled = !canName;
        $("pfNameNote").textContent = canName
          ? "You can sign in with your username or your user ID."
          : "Changing usernames is turned off by the admin.";
        $("pfPick").hidden = !canPic;
        $("pfRemove").hidden = !canPic || !me.image;
        if (!canPic) say("pfPicMsg", "Changing pictures is turned off by the admin.");
        else if ($("pfPicMsg").textContent.includes("turned off")) say("pfPicMsg", "");
      }

      $("meBtn").onclick = () => {
        ["pfPicMsg", "pfNameMsg", "pfPassMsg"].forEach((id) => say(id, ""));
        $("pfPassForm").reset();
        $("pfUsername").value = me.username;
        syncProfile();
        pdlg.showModal();
      };
      $("closeProfile").onclick = () => pdlg.close();
      pdlg.addEventListener("click", (e) => { if (e.target === pdlg) pdlg.close(); });

      $("pfFile").onchange = async () => {
        const file = $("pfFile").files[0];
        $("pfFile").value = "";
        if (!file) return;
        say("pfPicMsg", "Uploading…");
        try {
          const blob = await squarePicture(file);
          const fd = new FormData();
          fd.append("image", blob, blob.type === "image/webp" ? "avatar.webp" : "avatar.png");
          me = { ...me, ...(await api("POST", "/api/profile/image", fd)) };
          renderMe();
          syncProfile();
          say("pfPicMsg", "Picture updated", "ok");
        } catch (err) {
          say("pfPicMsg", err.message, "err");
        }
      };

      $("pfRemove").onclick = async () => {
        try {
          me = { ...me, ...(await api("DELETE", "/api/profile/image")) };
          renderMe();
          syncProfile();
          say("pfPicMsg", "Picture removed", "ok");
        } catch (err) {
          say("pfPicMsg", err.message, "err");
        }
      };

      $("pfNameForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = $("pfUsername").value.trim();
        if (username === me.username) return say("pfNameMsg", "That's already your username");
        try {
          me = { ...me, ...(await api("PUT", "/api/profile/username", { username })) };
          renderMe();
          syncProfile();
          say("pfNameMsg", "Username changed. Use it the next time you sign in.", "ok");
        } catch (err) {
          say("pfNameMsg", err.message, "err");
        }
      });

      $("pfPassForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        if ($("pfNew").value !== $("pfNew2").value) return say("pfPassMsg", "The two new passwords don't match", "err");
        try {
          await api("PUT", "/api/profile/password", { current: $("pfCur").value, password: $("pfNew").value });
          $("pfPassForm").reset();
          say("pfPassMsg", "Password changed", "ok");
        } catch (err) {
          say("pfPassMsg", err.message, "err");
        }
      });
      socket.on("error", (e) => { statusEl.textContent = typeof e === "string" ? e : "Message not sent. Try again."; });

      // ---------------- attachments ----------------
      function addFiles(files) {
        statusEl.textContent = "";
        if (settings.attachments_enabled === false) { statusEl.textContent = "Sending files is turned off by the admin."; return; }
        for (const f of files) {
          if (pendingFiles.length >= MAX_FILES) { statusEl.textContent = `You can attach up to ${MAX_FILES} files at once.`; break; }
          pendingFiles.push(f);
        }
        renderPending();
      }

      function renderPending() {
        pendingEl.replaceChildren(
          ...pendingFiles.map((f, i) =>
            el("span", { className: "chip" },
              el("span", {}, f.name),
              el("small", {}, fmtSize(f.size)),
              el("button", { type: "button", ariaLabel: `Remove ${f.name}`, onclick: () => { pendingFiles.splice(i, 1); renderPending(); } }, "×"))),
        );
      }

      fileInput.onchange = () => { addFiles(fileInput.files); fileInput.value = ""; };

      let dragDepth = 0;
      chatEl.addEventListener("dragenter", (e) => { if (e.dataTransfer.types.includes("Files")) { dragDepth++; chatEl.classList.add("dragging"); } });
      chatEl.addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; chatEl.classList.remove("dragging"); } });
      chatEl.addEventListener("dragover", (e) => e.preventDefault());
      chatEl.addEventListener("drop", (e) => {
        e.preventDefault(); dragDepth = 0; chatEl.classList.remove("dragging");
        if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
      });
      input.addEventListener("paste", (e) => { if (e.clipboardData.files.length) addFiles(e.clipboardData.files); });

      // ---------------- send ----------------
      $("composer").addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!activeId) return;
        const text = input.value.trim();
        if (!text && !pendingFiles.length) return;
        statusEl.textContent = "";

        if (!pendingFiles.length) {
          socket.emit("chat message", { conversationId: activeId, message: text });
          input.value = "";
          return;
        }

        const fd = new FormData();
        fd.append("message", text);
        pendingFiles.forEach((f) => fd.append("files", f));
        sendBtn.disabled = true;
        statusEl.style.color = "var(--slate)";
        statusEl.textContent = pendingFiles.length === 1 ? "Sending 1 file…" : `Sending ${pendingFiles.length} files…`;
        try {
          const label = statusEl.textContent.replace("…", "");
          await new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open("POST", `/api/conversations/${activeId}/messages`);
            xhr.upload.onprogress = (ev) => {
              if (ev.lengthComputable) statusEl.textContent = `${label}… ${Math.floor((ev.loaded / ev.total) * 100)}%`;
            };
            xhr.onload = () => {
              if (xhr.status >= 200 && xhr.status < 300) return resolve();
              let msg = "Message not sent. Try again.";
              try { msg = JSON.parse(xhr.responseText).message || msg; } catch {}
              reject(new Error(msg));
            };
            xhr.onerror = () => reject(new Error("Upload failed. Check the connection and try again."));
            xhr.send(fd);
          });
          input.value = "";
          pendingFiles = [];
          renderPending();
          statusEl.textContent = "";
        } catch (err) {
          statusEl.style.color = "";
          statusEl.textContent = err.message;
        } finally {
          statusEl.style.color = "";
          sendBtn.disabled = false;
          input.focus();
        }
      });

      // ---------------- new direct chat ----------------
      const dlg = $("peopleDlg");
      let people = [];

      function renderPeople() {
        const q = $("peopleSearch").value.trim().toLowerCase();
        const shown = people.filter((p) => p.username.toLowerCase().includes(q));
        $("people").replaceChildren(
          ...(shown.length
            ? shown.map((p) =>
                el("button", { className: "person", type: "button", onclick: () => startDirect(p.id) },
                  userAvatar(p.username, p.image), p.username))
            : [el("p", { className: "hint" }, people.length ? "No one matches that name." : "No other users yet. Add users to the users table to chat with them.")]),
        );
      }

      $("newChat").onclick = async () => {
        people = await (await fetch("/api/users")).json();
        $("peopleSearch").value = "";
        renderPeople();
        dlg.showModal();
        $("peopleSearch").focus();
      };
      $("peopleSearch").oninput = renderPeople;
      $("closeDlg").onclick = () => dlg.close();
      dlg.addEventListener("click", (e) => { if (e.target === dlg) dlg.close(); });

      async function startDirect(userId) {
        const r = await fetch("/api/conversations/direct", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId }),
        });
        if (!r.ok) return;
        const c = await r.json();
        dlg.close();
        await loadConversations();
        openConversation(c.id);
      }

      // ---------------- boot ----------------
      (async () => {
        const r = await fetch("/me");
        if (!r.ok) return (location.href = "/login");
        const { settings: s, ...profile } = await r.json();
        me = profile;
        renderMe();
        await loadConversations();
        applySettings(s);
        const main = conversations.find((c) => c.slug === "main") || conversations[0];
        if (main && matchMedia("(min-width: 761px)").matches) openConversation(main.id);
      })();
    </script>
    <script src="/crackers.js"></script>
    <script src="/board.js"></script>
  </body>
</html>
