<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sandes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/crackers.css" />
    <link rel="stylesheet" href="/board.css" />
    <link rel="stylesheet" href="/panels.css" />
    <link rel="stylesheet" href="/themes.css" />
    <style>
      :root {
        --aerogramme: #e3ebf2;
        --paper: #fbfcfd;
        --ink: #1b2a47;
        --postal-red: #b3303a;
        --slate: #66758c;
        --rule: #c9d5e1;
        --serif: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
        --sans: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
        --airmail: repeating-linear-gradient(
          -45deg,
          var(--postal-red) 0 14px,
          var(--paper) 14px 20px,
          var(--ink) 20px 34px,
          var(--paper) 34px 40px
        );
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }

      body {
        margin: 0;
        font-family: var(--sans);
        color: var(--ink);
        background-color: var(--aerogramme);
        background-image: repeating-linear-gradient(0deg, rgba(27, 42, 71, 0.025) 0 1px, transparent 1px 6px);
        -webkit-font-smoothing: antialiased;
      }

      button { font: inherit; color: inherit; }

      .sr-only {
        position: absolute; width: 1px; height: 1px; overflow: hidden;
        clip: rect(0 0 0 0); white-space: nowrap;
      }

      :focus-visible { outline: 2px solid var(--postal-red); outline-offset: 2px; }

      .app {
        height: 100dvh;
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
      }

      /* ================= Sidebar ================= */
      .sidebar {
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: var(--paper);
        border-right: 1px solid #d6e0ea;
      }

      .brand {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 20px 22px 24px;
      }

      .brand::after {
        content: "";
        position: absolute; left: 0; right: 0; bottom: 0;
        height: 6px;
        background: var(--airmail);
      }

      .mark { width: 38px; height: 38px; color: var(--postal-red); flex: none; }

      .wordmark {
        margin: 0;
        font-family: var(--serif);
        font-weight: 500;
        font-size: 2rem;
        line-height: 1;
        letter-spacing: -0.02em;
      }

      .wordmark .initial { font-style: italic; font-weight: 400; }

      .lists { flex: 1; overflow-y: auto; padding: 14px 10px; }

      .list-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 18px 12px 8px;
        font-family: var(--serif);
        font-style: italic;
        font-size: 1rem;
        color: var(--slate);
      }

      .new-chat {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1.5px solid var(--rule);
        background: transparent;
        border-radius: 999px;
        padding: 5px 12px;
        font-family: var(--sans);
        font-style: normal;
        font-size: 0.8125rem;
        font-weight: 600;
        color: var(--ink);
        cursor: pointer;
      }

      .new-chat:hover { border-color: var(--ink); }

      .convo {
        width: 100%;
        display: grid;
        grid-template-columns: 40px 1fr auto;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }

      .convo:hover { background: #eef3f8; }
      .convo[aria-current="true"] { background: var(--aerogramme); }

      .avatar {
        width: 40px; height: 40px;
        border-radius: 50%;
        display: grid; place-items: center;
        font-family: var(--serif);
        font-size: 1.125rem;
        font-weight: 600;
        color: #fff;
        flex: none;
      }

      .avatar { position: relative; overflow: hidden; }
      .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .avatar.sm { width: 28px; height: 28px; font-size: 0.8125rem; }
      .avatar.lg { width: 84px; height: 84px; font-size: 2rem; }
      .avatar.room { background: transparent; border: 1.5px solid var(--postal-red); color: var(--postal-red); }
      .avatar.room svg { width: 24px; height: 24px; }

      .convo .meta { min-width: 0; }
      .convo .name { font-weight: 600; font-size: 0.9375rem; }

      .convo .preview {
        display: block;
        margin-top: 2px;
        font-size: 0.8125rem;
        color: var(--slate);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }

      .convo .side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
      .convo .when { font-size: 0.75rem; color: var(--slate); }

      .badge {
        min-width: 20px; height: 20px; padding: 0 6px;
        border-radius: 999px;
        background: var(--postal-red);
        color: #fff;
        font-size: 0.75rem; font-weight: 600;
        display: grid; place-items: center;
      }

      .hint { margin: 6px 12px; font-size: 0.875rem; color: var(--slate); line-height: 1.45; }

      .account {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 18px;
        border-top: 1px solid #d6e0ea;
        font-size: 0.875rem;
        color: var(--slate);
      }

      .account strong { color: var(--ink); }

      .logout {
        margin-left: auto;
        color: var(--ink);
        text-decoration: none;
        font-weight: 500;
        padding: 6px 12px;
        border: 1.5px solid var(--rule);
        border-radius: 999px;
      }

      .logout:hover { border-color: var(--ink); }

      .me-btn {
        flex: 1; min-width: 0;
        display: flex; align-items: center; gap: 10px;
        margin: -6px 0 -6px -8px; padding: 6px 8px;
        border: 0; border-radius: 12px;
        background: transparent; text-align: left; cursor: pointer;
      }

      .me-btn:hover { background: #eef3f8; }
      .me-text { min-width: 0; display: flex; flex-direction: column; }
      .me-text strong { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .me-text small { font-size: 0.75rem; color: var(--slate); }

      .icon-link {
        flex: none; width: 34px; height: 34px;
        display: grid; place-items: center;
        border: 1.5px solid var(--rule); border-radius: 50%;
        color: var(--ink);
      }

      .icon-link:hover { border-color: var(--ink); }
      .icon-link svg { width: 18px; height: 18px; }
      .icon-link[hidden], .attach[hidden], .new-chat[hidden], .cracker-btn[hidden], .pill-btn[hidden] { display: none; }

      /* ================= Chat pane ================= */
      .chat {
        position: relative;
        display: grid;
        grid-template-rows: auto 1fr auto;
        grid-template-columns: minmax(0, 1fr);
        min-height: 0;
        min-width: 0;
      }

      .chat-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 28px;
        border-bottom: 1px solid #d6e0ea;
        background: rgba(251, 252, 253, 0.7);
        backdrop-filter: blur(6px);
      }

      .back {
        display: none;
        border: 0; background: transparent; padding: 6px; margin-left: -6px; cursor: pointer;
      }

      .back svg { width: 22px; height: 22px; }

      .chat-title { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 1.5rem; line-height: 1.1; }
      .chat-sub { margin: 2px 0 0; font-size: 0.8125rem; color: var(--slate); }

      .feed { overflow-y: auto; padding: 24px 28px 12px; }

      .feed-inner { max-width: 820px; margin: 0 auto; }

      .day {
        display: flex; align-items: center; gap: 14px;
        margin: 22px 0 18px;
        font-family: var(--serif); font-style: italic; font-size: 0.9375rem;
        color: var(--slate);
      }

      .day::before, .day::after { content: ""; flex: 1; height: 1px; background: var(--rule); }

      .msg { display: flex; flex-direction: column; align-items: flex-start; margin-top: 10px; }
      .msg.cont { margin-top: 2px; }
      .msg { position: relative; }
      .msg.has-av { padding-left: 36px; }
      .msg .mav { position: absolute; left: 0; top: 0; }
      .msg .from { font-size: 0.75rem; font-weight: 600; margin: 0 0 3px 4px; }
      .msg.cont .from, .msg.mine .from, .chat.direct .msg .from { display: none; }

      .bubble {
        position: relative;
        max-width: min(62ch, 78%);
        padding: 6px 12px 6px;
        background: var(--paper);
        border: 1px solid #d6e0ea;
        border-radius: 4px 14px 14px 14px;
        box-shadow: 0 1px 0 rgba(27, 42, 71, 0.06);
        font-size: 0.9375rem;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }

      .bubble .text { white-space: pre-wrap; }
      .msg.cont .bubble { border-top-left-radius: 14px; }

      /* time sits at the end of the last text line; an invisible copy reserves its space */
      .bubble time { font-size: 0.6875rem; line-height: 1; color: var(--slate); white-space: nowrap; }
      .bubble .text time { position: absolute; right: 12px; bottom: 7px; }
      .bubble .stamp-space { display: inline-block; visibility: hidden; margin-left: 10px; font-size: 0.6875rem; line-height: 1; }
      .bubble > time { display: block; text-align: right; margin-top: 2px; }

      .msg.mine { align-items: flex-end; }

      .msg.mine .bubble {
        background: var(--ink); border-color: var(--ink); color: var(--paper);
        border-radius: 14px 4px 14px 14px;
      }

      .msg.mine.cont .bubble { border-top-right-radius: 14px; }
      .msg.mine .bubble time { color: #a9b6cb; }

      /* attachments inside bubbles */
      .files { display: flex; flex-direction: column; gap: 6px; margin: 0 -6px 4px; padding-top: 0; }
      .files + .text { margin-top: 2px; }

      .shot { display: block; border-radius: 9px; overflow: hidden; line-height: 0; }

      .shot img {
        max-width: min(320px, 100%);
        max-height: 320px;
        object-fit: cover;
        background: #e9eff5;
      }

      .file {
        display: flex; align-items: center; gap: 12px;
        min-width: 200px;
        padding: 8px 10px;
        border-radius: 10px;
        background: #eef3f8;
        color: var(--ink);
        text-decoration: none;
      }

      .msg.mine .file { background: rgba(255, 255, 255, 0.1); color: var(--paper); }
      .file:hover { text-decoration: underline; }
      .file svg { width: 26px; height: 26px; flex: none; color: var(--postal-red); }
      .msg.mine .file svg { color: #f1b9be; }
      .file .fname { font-weight: 600; font-size: 0.9375rem; overflow-wrap: anywhere; }
      .file .fsize { display: block; font-size: 0.75rem; opacity: 0.75; }

      .msg.fresh .bubble { animation: arrive 260ms ease-out both; }

      @keyframes arrive {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: none; }
      }

      .empty {
        margin: 16vh auto 0;
        max-width: 32ch;
        text-align: center;
        font-family: var(--serif); font-style: italic; font-size: 1.25rem; line-height: 1.5;
        color: var(--slate);
      }

      /* ================= Composer ================= */
      .composer-wrap { padding: 8px 28px 22px; }
      .composer-inner { max-width: 820px; margin: 0 auto; }

      .status { min-height: 0; margin-bottom: 6px; font-size: 0.875rem; color: #8a2129; }
      .status:empty { display: none; }

      .pending { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
      .pending:empty { display: none; }

      .chip {
        display: inline-flex; align-items: center; gap: 8px;
        max-width: 260px;
        padding: 6px 6px 6px 12px;
        background: var(--paper);
        border: 1.5px solid var(--rule);
        border-radius: 999px;
        font-size: 0.8125rem;
      }

      .chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .chip small { color: var(--slate); flex: none; }

      .chip button {
        flex: none;
        width: 22px; height: 22px;
        display: grid; place-items: center;
        border: 0; border-radius: 50%;
        background: #e3ebf2;
        cursor: pointer;
        font-size: 14px; line-height: 1;
      }

      .chip button:hover { background: var(--rule); }

      .composer { display: flex; gap: 10px; align-items: stretch; }

      .attach {
        flex: none;
        width: 52px;
        display: grid; place-items: center;
        border: 1.5px solid var(--rule);
        border-radius: 50%;
        background: var(--paper);
        cursor: pointer;
      }

      .attach:hover { border-color: var(--ink); }
      .attach svg { width: 22px; height: 22px; }

      .composer input[type="text"] {
        flex: 1; min-width: 0;
        padding: 15px 20px;
        border: 1.5px solid var(--rule);
        border-radius: 999px;
        background: var(--paper);
        font-family: var(--sans); font-size: 1rem; color: var(--ink);
      }

      .composer input[type="text"]::placeholder { color: #8f9bb0; }
      .composer input[type="text"]:focus { outline: none; border-color: var(--ink); }
      .composer input[type="text"]:disabled { background: #eef3f8; }

      .send {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 0 24px;
        border: 0; border-radius: 999px;
        background: var(--postal-red);
        color: #fff;
        font-weight: 600; font-size: 1rem;
        cursor: pointer;
      }

      .send:hover { background: #9c2730; }
      .send:disabled { opacity: 0.55; cursor: default; }
      .send svg { width: 18px; height: 18px; }

      /* drag & drop overlay */
      .drop {
        position: absolute; inset: 12px;
        display: none; place-items: center;
        border: 2.5px dashed var(--postal-red);
        border-radius: 18px;
        background: rgba(251, 252, 253, 0.92);
        font-family: var(--serif); font-style: italic; font-size: 1.5rem;
        color: var(--postal-red);
        pointer-events: none;
        z-index: 5;
      }

      .chat.dragging .drop { display: grid; }

      /* ================= New chat dialog ================= */
      dialog {
        width: min(420px, calc(100vw - 32px));
        padding: 0;
        border: 0;
        border-radius: 16px;
        background: var(--paper);
        color: var(--ink);
        box-shadow: 0 30px 80px -20px rgba(27, 42, 71, 0.5);
      }

      dialog::backdrop { background: rgba(27, 42, 71, 0.35); }

      .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 22px 8px; }
      .dlg-head h2 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 1.5rem; }

      .x {
        width: 34px; height: 34px;
        border: 0; border-radius: 50%;
        background: #eef3f8;
        cursor: pointer; font-size: 18px;
      }

      .dlg-search { padding: 8px 22px 12px; }

      .dlg-search input {
        width: 100%;
        padding: 12px 16px;
        border: 1.5px solid var(--rule);
        border-radius: 999px;
        font: inherit;
        background: #fff;
      }

      .dlg-search input:focus { outline: none; border-color: var(--ink); }

      .people { max-height: 50vh; overflow-y: auto; padding: 0 10px 14px; }

      .person {
        width: 100%;
        display: flex; align-items: center; gap: 12px;
        padding: 10px 12px;
        border: 0; border-radius: 12px;
        background: transparent;
        cursor: pointer; text-align: left;
        font-weight: 600;
      }

      .person:hover { background: #eef3f8; }

      /* ================= Profile ================= */
      .pf { padding: 6px 22px 22px; }
      .pf-top { display: flex; gap: 18px; align-items: center; padding-bottom: 18px; border-bottom: 1px solid #e1e8ef; }
      .pf-name { font-size: 1.25rem; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
      .pf-meta { margin-top: 2px; font-size: 0.8125rem; color: var(--slate); }
      .pf-meta b { color: var(--ink); font-weight: 600; letter-spacing: 0.02em; }
      .pf-pic { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
      .pf-sec { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
      .pf-sec h3 { margin: 0; font-size: 0.8125rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--slate); }
      .pf-row { display: flex; gap: 8px; }
      .pf input[type="text"], .pf input[type="password"] {
        flex: 1; min-width: 0; width: 100%;
        padding: 11px 16px;
        border: 1.5px solid var(--rule); border-radius: 999px;
        background: #fff; font: inherit; color: var(--ink);
      }
      .pf input:focus { outline: none; border-color: var(--ink); }
      .pf input:disabled { background: #eef3f8; color: var(--slate); }
      .pf-note, .pf-msg { margin: 0; font-size: 0.8125rem; color: var(--slate); line-height: 1.4; }
      .pf-msg:empty, .pf-note:empty { display: none; }
      .pf-msg.err { color: #8a2129; }
      .pf-msg.ok { color: #2e6b5a; }

      .pill-btn {
        flex: none;
        display: inline-flex; align-items: center; justify-content: center;
        padding: 8px 16px;
        border: 1.5px solid var(--rule); border-radius: 999px;
        background: var(--paper);
        font-size: 0.875rem; font-weight: 600; color: var(--ink);
        cursor: pointer;
      }
      .pill-btn:hover { border-color: var(--ink); }
      .pill-btn.solid { background: var(--ink); border-color: var(--ink); color: var(--paper); }
      .pill-btn.solid:hover { background: #24375c; }
      .pill-btn:disabled { opacity: 0.5; cursor: default; }
      .pf-sec > .pill-btn { align-self: flex-start; }

      /* ================= Mobile ================= */
      @media (max-width: 760px) {
        .app { grid-template-columns: minmax(0, 1fr); }
        .app .chat { display: none; }
        .app.in-chat .sidebar { display: none; }
        .app.in-chat .chat { display: grid; }
        .back { display: inline-grid; }
        .chat-head { padding: 12px 14px; }
        .feed { padding: 16px 14px 10px; }
        .bubble { max-width: 86%; }
        .composer-wrap { padding: 8px 12px 14px; }
        .attach { width: 48px; }
        .send { padding: 0 16px; }
        .send span { display: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        .msg.fresh .bubble { animation: none; }
      }
    </style>
    <link rel="stylesheet" href="/chat.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="dove" viewBox="-28 -26 56 42">
        <path opacity=".55" d="M2 3 C6 -7 14 -14 27 -17 C21 -8 15 -1 10 5 Z" />
        <path d="M-23 5 C-20 1 -15 0 -11 2 C-5 5 3 6 10 3 L25 -3 L21 6 C14 11 2 14 -8 12 C-14 11 -19 9 -23 5 Z" />
        <path d="M-6 4 C-5 -8 2 -18 15 -23 C11 -13 9 -5 6 5 Z" />
        <path d="M-23 5 L-27 6.5 L-22.5 7 Z" />
      </symbol>
      <symbol id="doc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><path d="M14 2v6h6" />
      </symbol>
    </svg>

    <div class="app" id="app">
      <!-- ============ Sidebar ============ -->
      <aside class="sidebar" aria-label="Conversations">
        <div class="brand">
          <svg class="mark" fill="currentColor" aria-hidden="true"><use href="#dove" /></svg>
          <h1 class="wordmark"><span class="initial">S</span>andes</h1>
        </div>

        <div class="side-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="m20 20-4.2-4.2" /></svg>
          <label for="search" class="sr-only">Search messages</label>
          <input id="search" type="search" placeholder="Search messages" autocomplete="off" />
          <button class="search-clear" id="searchClear" type="button" aria-label="Clear search" hidden>×</button>
        </div>

        <nav class="lists" id="lists">
          <div class="list-head">
            <span>Groups</span>
            <span class="head-btns">
              <button class="new-chat ghost" id="browseBtn" type="button" title="Find public channels">Browse</button>
              <button class="new-chat" id="newGroup" type="button" title="New group or channel">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
                New
              </button>
            </span>
          </div>
          <div id="rooms"></div>

          <div class="list-head">
            <span>Direct messages</span>
            <button class="new-chat" id="newChat" type="button" title="New direct message">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
              New
            </button>
          </div>
          <div id="directs"></div>
        </nav>
        <div class="results" id="results" hidden></div>

        <div class="account">
          <button class="me-btn" id="meBtn" type="button" title="Your profile: picture, username, password">
            <span id="meAvatar"></span>
            <span class="me-text"><strong id="me">…</strong><small id="meSub">Profile</small></span>
          </button>
          <button class="icon-link" id="bellBtn" type="button" title="Notifications" aria-label="Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z" /><path d="M10 20.5a2 2 0 0 0 4 0" /></svg>
          </button>
          <a class="icon-link" id="adminLink" href="/admin" title="Admin: users and settings" aria-label="Admin: users and settings" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5 4 5.5v6c0 4.6 3.3 8.6 8 10 4.7-1.4 8-5.4 8-10v-6z" /><path d="m9 12 2 2 4-4" /></svg>
          </a>
          <a class="logout" href="/logout">Log out</a>
        </div>
      </aside>

      <!-- ============ Chat ============ -->
      <section class="chat" id="chat" aria-labelledby="chatTitle">
        <header class="chat-head">
          <button class="back" id="back" type="button" aria-label="Back to conversations">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6" /></svg>
          </button>
          <div class="head-main" id="headMain" role="button" tabindex="0" title="Chat info">
            <div id="chatAvatar"></div>
            <div class="head-text">
              <h2 class="chat-title" id="chatTitle">Main room</h2>
              <p class="chat-sub" id="chatSub">Everyone can read messages here</p>
            </div>
          </div>
          <div class="head-tools" id="headTools"></div>
        </header>

        <div class="pinbar" id="pinBar" hidden></div>

        <main class="feed" id="feed" aria-live="polite">
          <div class="feed-inner" id="messages"></div>
        </main>
        <button class="to-latest" id="toLatest" type="button" title="Jump to the newest message" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6" /></svg>
          <span class="n"></span>
        </button>

        <div class="composer-wrap">
          <div class="composer-inner">
            <div class="status" id="status" role="status"></div>
            <div class="pending" id="pending" aria-label="Files to send"></div>
            <div class="compose-bar" id="composeBar" hidden></div>
            <div class="mention-box" id="mentionBox" role="listbox" aria-label="People to mention" hidden></div>
            <div class="join-bar" id="joinBar" hidden>
              <span>You're looking at a public channel.</span>
              <button class="pill-btn solid" id="joinBtn" type="button">Join channel</button>
            </div>
            <form class="composer" id="composer" autocomplete="off">
              <label class="attach" id="attachBtn" title="Attach files">
                <span class="sr-only">Attach files</span>
                <input type="file" id="fileInput" multiple hidden />
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48" /></svg>
              </label>
              <button class="cracker-btn" id="crackerBtn" type="button" title="Diwali crackers" aria-label="Diwali crackers" aria-expanded="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="15" r="6.5" /><path d="M14.6 10.4c1-1.6 2-2.9 3.9-3.4" /><path d="M20.6 1.8v1.8M23 4.6h-1.8M22.4 2.4l-1.2 1.2" /></svg>
              </button>
              <button class="plus-btn" id="plusBtn" type="button" title="Poll, task, notes, effects" aria-label="More: poll, task, notes, effects">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
              </button>
              <div class="msg-box">
                <label for="msg" class="sr-only">Message</label>
                <textarea id="msg" rows="1" placeholder="Write a message" maxlength="4000"></textarea>
                <button class="fx-btn" id="fxBtn" type="button" title="Send with an effect" aria-label="Send with an effect">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c.7 4.2 1.8 5.3 6 6-4.2.7-5.3 1.8-6 6-.7-4.2-1.8-5.3-6-6 4.2-.7 5.3-1.8 6-6z" /><path d="M19 15c.3 1.7.8 2.2 2.5 2.5-1.7.3-2.2.8-2.5 2.5-.3-1.7-.8-2.2-2.5-2.5 1.7-.3 2.2-.8 2.5-2.5z" /></svg>
                </button>
              </div>
              <button class="send" id="send" type="submit">
                <span>Send</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13" /><path d="M22 2 15 22l-4-9-9-4 20-7z" /></svg>
              </button>
            </form>
          </div>
        </div>

        <div class="drop" aria-hidden="true">Drop files to attach</div>
      </section>
    </div>

    <div class="toast" id="toast" role="status" hidden></div>

    <!-- ============ New direct chat ============ -->
    <dialog id="peopleDlg" aria-labelledby="peopleTitle">
      <div class="dlg-head">
        <h2 id="peopleTitle">New message</h2>
        <button class="x" type="button" id="closeDlg" aria-label="Close">×</button>
      </div>
      <div class="dlg-search">
        <label for="peopleSearch" class="sr-only">Search people</label>
        <input id="peopleSearch" type="search" placeholder="Search people" />
      </div>
      <div class="people" id="people"></div>
    </dialog>

    <!-- ============ Profile ============ -->
    <dialog id="profileDlg" aria-labelledby="profileTitle">
      <div class="dlg-head">
        <h2 id="profileTitle">Your profile</h2>
        <button class="x" type="button" id="closeProfile" aria-label="Close">×</button>
      </div>
      <div class="pf">
        <div class="pf-top">
          <div id="pfAvatar"></div>
          <div>
            <div class="pf-name" id="pfName"></div>
            <div class="pf-meta">User ID <b id="pfUid"></b> · <span id="pfRole"></span></div>
            <div class="pf-pic">
              <label class="pill-btn" id="pfPick">
                Change picture
                <input type="file" id="pfFile" accept="image/png,image/jpeg,image/gif,image/webp" hidden />
              </label>
              <button class="pill-btn" id="pfRemove" type="button">Remove</button>
            </div>
            <p class="pf-msg" id="pfPicMsg" role="status"></p>
          </div>
        </div>

        <form class="pf-sec" id="pfNameForm" autocomplete="off">
          <h3><label for="pfUsername">Username</label></h3>
          <div class="pf-row">
            <input type="text" id="pfUsername" maxlength="40" />
            <button class="pill-btn solid" id="pfNameSave" type="submit">Save</button>
          </div>
          <p class="pf-note" id="pfNameNote"></p>
          <p class="pf-msg" id="pfNameMsg" role="status"></p>
        </form>

        <form class="pf-sec" id="pfPassForm">
          <h3>Password</h3>
          <input type="text" name="username" autocomplete="username" hidden id="pfPassUser" />
          <input type="password" id="pfCur" placeholder="Current password" autocomplete="current-password" aria-label="Current password" required />
          <input type="password" id="pfNew" placeholder="New password (at least 6 characters)" autocomplete="new-password" aria-label="New password" required minlength="6" />
          <input type="password" id="pfNew2" placeholder="New password again" autocomplete="new-password" aria-label="New password again" required />
          <button class="pill-btn solid" type="submit">Change password</button>
          <p class="pf-msg" id="pfPassMsg" role="status"></p>
        </form>
      </div>
    </dialog>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/chat.js"></script>
    <script src="/crackers.js"></script>
    <script src="/board.js"></script>
    <script src="/panels.js"></script>
    <script src="/themes.js"></script>
    <script src="/effects.js"></script>
  </body>
</html>
